  <div id="over" hidden><div class="px" style="font-size:12px">Defeated</div><div id="ovt"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button data-a="delveAgain" style="background:#d94a4a;color:#fff;border-color:#fff">⚔ Delve Again</button><button data-a="camp">Go to camp</button></div></div></div>
 <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>

<script type="module">
const out=[],ck=(n,c,x)=>out.push(n+':'+(c?'ok':'FAIL'+(x!==undefined?'('+x+')':'')));

 ck('there-are-ten-relics',rl.RELICS.length===10&&new Set(rl.RELICS.map(x=>x.id)).size===10);

 reset();const bad=rl.makeRelic('emberfang',40,3);bad.un='BAD ID!';const bad2=rl.makeRelic('phoenix',40,3);bad2.un={x:1};

 ck('bad-relic-ids-dropped',st.S.bag.every(x=>x.un===undefined),JSON.stringify(st.S.bag.map(x=>x.un)));

 reset();st.S.eq.rhand=rl.makeRelic('emberfang',40,3);localStorage.setItem(KEY,JSON.stringify(st.S));st.load();ck('good-relic-survives-save-load',st.S.eq.rhand.un==='emberfang');

 st.S.life=1e5;st.S.gold=1e30;asc.ascend();
 ck('worn-relics-survive-ascension',st.S.eq.rhand&&st.S.eq.rhand.un==='emberfang'&&st.S.eq.lhand&&st.S.eq.lhand.un==='wyrmscale');
 ck('carried-relic-survives-ascension',st.S.bag.length===1&&st.S.bag[0].un==='phoenix',st.S.bag.length);

 reset();let r=fresh();for(let i=0;i<30;i++)bt.tick(.1);ck('no-ember-without-relic',!r.ember);

 {const e0=r.eHp;for(let i=0;i<20;i++){r.hT=-1e9;bt.tick(.1)}ck('ember-burns-the-enemy',r.eHp<e0);}

 reset();r=fresh();r.eAtk=1e3;r.hp=1e15;{for(let i=0;i<60;i++)bt.tick(.1);ck('no-block-without-relic',!r.wy)}

 if(got){r.hT=10;r.eHp=1;st.S.relicFound={};bt.tick(.1);ck('looting-records-the-relic',st.S.relicFound[got.un]===1&&r.loot.some(x=>x.un===got.un),JSON.stringify(st.S.relicFound));

  ck('finding-a-relic-flags-the-gear-tab',st.S.relicNew===got.un);
  r.over=false;bt.die();ck('defeat-screen-mentions-the-relic',document.querySelector('#ovt').innerHTML.includes('Mythic Relic')&&document.querySelector('#ovt').innerHTML.includes(got.nm));
  bn&&bn.remove()}

 // 6b the seven newer powers. Each relic is built with plain stats; the 'off' twin is the same item without its id, so only the power differs.
 const wear=(id,slot,on)=>{const it=rl.makeRelic(id,40,3);it.st={atk:5};if(!on)delete it.un;st.S.eq[slot]=it};
 const dmgOf=(setup)=>{reset();setup();const r=fresh();r.hT=10;r.eHp=r.eMax=1e12;r.eAtk=0;const e0=r.eHp;Math.random=()=>0;bt.tick(.1);Math.random=rnd;return e0-r.eHp};
 {const a=dmgOf(()=>wear('stormcaller','gloves',true)),b=dmgOf(()=>wear('stormcaller','gloves',false));ck('stormcaller-crit-adds-60-percent-lightning',a>0&&b>0&&a/b>1.5&&a/b<1.7,a+'/'+b)}
 {const a=dmgOf(()=>{wear('voidreaver','rhand',true)}),b=dmgOf(()=>wear('voidreaver','rhand',false));ck('voidreaver-no-bonus-on-healthy-enemy',Math.abs(a/b-1)<.05,a+'/'+b);
  const low=(on)=>{reset();wear('voidreaver','rhand',on);const r=fresh();r.hT=10;r.eMax=1e12;r.eHp=2e11;r.eAtk=0;const e0=r.eHp;Math.random=()=>0;bt.tick(.1);Math.random=rnd;return e0-r.eHp};
  const x=low(true),y=low(false);ck('voidreaver-triples-damage-below-25-percent',x>0&&y>0&&x/y>2.9&&x/y<3.1,x+'/'+y)}
 {const crit=(on)=>{reset();wear('seer','amu1',on);const r=fresh();r.hT=10;r.eAtk=0;Math.random=()=>.2;bt.tick(.1);Math.random=rnd;return r.critT>0};ck('seer-adds-crit-chance',crit(true)===true&&crit(false)===false)}
 {const hits=(on)=>{reset();wear('windrunner','boots',on);const r=fresh();r.hT=0;r.eAtk=0;let n=0,last=r.eHp;Math.random=()=>.999;for(let i=0;i<100;i++){bt.tick(.1);if(r.eHp<last)n++;last=r.eHp}Math.random=rnd;return n};const a=hits(true),b=hits(false);ck('windrunner-attacks-faster',a>b&&a>=b*1.15,a+' vs '+b)}
 {const run1=(on)=>{reset();wear('rime','legs',on);const r=fresh();r.hT=0;r.eAtk=0;let mx=0,hit=0,last=r.eHp;Math.random=()=>.999;for(let i=0;i<120;i++){bt.tick(.1);if(r.eHp<last)hit++;last=r.eHp;mx=Math.max(mx,r.stun)}Math.random=rnd;return {mx,hit}};const a=run1(true),b=run1(false);ck('rime-freezes-every-sixth-hit',a.mx>=1.3&&b.mx===0&&a.hit>=5,JSON.stringify([a,b]))}
 {const gold=(on)=>{reset();wear('midas','amu1',on);const r=fresh();r.stage=40;r.hT=10;r.eHp=1;r.eAtk=0;const g0=st.S.gold;Math.random=()=>.5;bt.tick(.1);Math.random=rnd;return st.S.gold-g0};const a=gold(true),b=gold(false);ck('midas-adds-60-percent-gold',b>0&&a/b>1.55&&a/b<1.65,a+'/'+b)}
 {const heal=(on)=>{reset();wear('drowned','head',on);const r=fresh();r.hT=10;r.eHp=1;r.eAtk=0;r.hp=1;Math.random=()=>.5;bt.tick(.1);Math.random=rnd;return r.hp};const a=heal(true),b=heal(false);const mh=sx.stats().hp;ck('drowned-heals-10-percent-on-kill',a-b>mh*.09&&a-b<mh*.11,(a-b)+' vs '+mh*.1)}

 reset();st.S.eq.rhand=rl.makeRelic('emberfang',40,3);st.S.relicFound={emberfang:1};st.setMode('camp');cp.view();st.setTab('g');cp.camp();

reset();{const it=rl.makeRelic('midas',40,3);st.S.bag=[it];st.S.relicNew='midas';st.setMode('camp');cp.view();st.setTab('g');cp.camp();
  const h2=document.querySelector('#cbody').innerHTML;ck('gear-tab-has-a-new-relic-notice',h2.includes('New Mythic Relic')&&h2.includes('Equip it')&&h2.includes('Midas Locket'));
