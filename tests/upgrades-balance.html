<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>running</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head><body><div id="app">
<header><h1>Delve</h1><div id="top"></div></header>
<section id="battle" hidden>
 <div class="cv"><canvas id="c" width="192" height="108"></canvas><div id="fxl"></div>
  <div id="over" hidden><div class="px" style="font-size:12px">Defeated</div><div id="ovt"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button data-a="delveAgain" style="background:#d94a4a;color:#fff;border-color:#fff">⚔ Delve Again</button><button data-a="camp">Go to camp</button></div></div></div>
 <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>
 <div class="bar m" id="mpw"><i id="mpb"></i><span id="mpt"></span></div>
 <div class="bar e"><i id="ehb"></i><span id="ent"></span></div>
 <div class="row sp" style="margin:6px 0"><div class="row" id="spells"></div><div class="row"><button class="s alt" data-a="spd" id="spdb"></button><button class="s alt" data-a="end">End run</button></div></div>
 <div class="mute">Last drop</div><div id="last"></div><div class="mute" style="margin-top:6px">Loot this run</div><div id="feed"></div>
</section>
<section id="camp" hidden>
 <div class="row sp"><div class="tabs"><button data-a="tab" data-v="g" id="tg">Gear</button><button data-a="tab" data-v="u" id="tu">Upgrades</button><button data-a="tab" data-v="v" id="tv">Vault</button><button data-a="tab" data-v="m" id="tm">Magic</button><button data-a="tab" data-v="p" id="tp">Pets</button><button data-a="tab" data-v="r" id="tr2">Auras</button><button data-a="tab" data-v="i" id="ti">Idle</button><button data-a="tab" data-v="a" id="ta">Ascend</button><button data-a="tab" data-v="l" id="tl">Scores</button><button data-a="tab" data-v="x" id="tx">Account</button></div></div>
 <div style="margin:8px 0"><button data-a="delve" style="width:100%;font-size:22px;padding:10px;background:var(--btn);border-width:4px;box-shadow:5px 5px 0 var(--ink)">⚔ DELVE</button></div>
 <div id="sdw" class="row" style="margin:6px 0"></div><div id="cbody"></div><div style="margin:16px 0"><button class="s alt" data-a="reset">Reset save</button></div>
</section>
</div>
<script type="module">
// For each combat node: gain at level N vs spending the SAME gold on Might, across hero builds (no pet).
const out=[];window.onerror=(m,u,l)=>out.push('ERR '+m+' @'+String(u).split('/').pop()+':'+l);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const q=new URLSearchParams(location.search),RUNS=+(q.get('runs')||24),LV=+(q.get('lv')||5),SCALES=(q.get('scales')||'1.3,1.8').split(',').map(Number),CAP=15000;
try{
 await import('/src/main.js');
 const st=await import('/src/state.js'),bt=await import('/src/battle.js'),asc=await import('/src/ascension.js'),sk=await import('/src/skilltree.js');
 const KEY='hollow-delve-2';
 const item=(ty,stt,il=40)=>({id:Math.floor(Math.random()*1e9),ty,ri:3,lv:1,il,nm:'Sim '+ty,st:stt});
 const common=()=>({rhand:item('weapon',{atk:40}),head:item('head',{def:15,hp:150}),chest:item('chest',{def:25,hp:300}),boots:item('boots',{def:8,hp:80})});
 const BUILDS={
  thorn:{tr:{might:8,vigor:10,grit:24,regen:4,greed:2},eq:{amu1:item('amulet',{thorn:80}),amu2:item('amulet',{def:25,hp:150}),legs:item('legs',{def:25,hp:150})}},
  sustain:{tr:{might:8,vigor:26,grit:4,regen:7,greed:2},eq:{amu1:item('amulet',{hp:250}),amu2:item('amulet',{hp:250}),legs:item('legs',{hp:250,def:10})}},
  crit:{tr:{might:12,vigor:8,haste:12,fury:14},eq:{amu1:item('amulet',{crit:12}),amu2:item('amulet',{crit:10,spd:.4}),gloves:item('gloves',{atk:20,crit:6})}},
  support:{magic:true,tr:{might:5,vigor:10,arcana:12,spMana:4,spRegen:8,spCdr:10,mender:1,spHeal:4,frost:1,spFrostDur:3},eq:{amu1:item('amulet',{mpr:3}),amu2:item('amulet',{mpr:3}),gloves:item('gloves',{atk:10}),legs:item('legs',{hp:150,def:10})}},
  fire:{magic:true,tr:{might:5,vigor:10,arcana:12,spFirePow:20,spBurn:8,spMeteor:1,spMana:6,spRegen:4,spCdr:1},eq:{amu1:item('amulet',{mpr:3}),amu2:item('amulet',{mpr:3}),gloves:item('gloves',{atk:10}),legs:item('legs',{hp:150,def:10})}},
  economy:{tr:{might:8,vigor:10,greed:14,eyes:8,plunder:6,luck:4},eq:{amu1:item('amulet',{gf:60}),amu2:item('amulet',{gf:40}),legs:item('legs',{hp:150,def:10})}},
 };
 const NODES=['bulwark','vamp','secondWind','evasion','executioner','deadlyAim','opening','rampage','bossSlayer','goblin'];
 const goldFor=(k,n)=>{const d=sk.NODE[k];let t=0;for(let i=0;i<n;i++)t+=Math.round(d.b*Math.pow(d.g,i));return t};
 const mightExtra=(m0,gold)=>{const d=sk.NODE.might;let x=0,t=0;for(;;){const c=Math.round(d.b*Math.pow(d.g,m0+x));if(t+c>gold)break;t+=c;x++}return x+(gold-t)/Math.round(d.b*Math.pow(d.g,m0+x))};
 const setup=(b,sc,extra)=>{localStorage.removeItem(KEY);localStorage.removeItem('hd-lb');st.load();const S=st.S;S.tr={};for(const k in b.tr)S.tr[k]=Math.round(b.tr[k]*sc);for(const k in extra)S.tr[k]=(S.tr[k]||0)+extra[k];
  S.rl=b.magic?{rMagic:1}:{};S.eq={...common(),...b.eq};S.bag=[];S.gold=0;S.best=1;S.life=1;S.speed=1;S.ap=-1};
 const auto=(r,s)=>{if(!asc.hasSp(0))return;bt.cast(0);if(r.hp<s.hp*.5)bt.cast(1);if(r.stun<=0)bt.cast(2);bt.cast(3)};
 const mean=a=>a.reduce((x,y)=>x+y,0)/a.length;
 const play=(b,sc,extra)=>{const P=[],G=[];for(let k=0;k<RUNS;k++){setup(b,sc,extra);bt.startRun();const r=st.run;let n=0;while(!r.over&&n<CAP){if(b.magic)auto(r,{hp:r.maxHp});bt.tick(.1);n++}P.push(r.stage+1-Math.max(0,r.eHp)/r.eMax);G.push(r.gold/Math.max(1,r.t)*60)}return{p:mean(P),g:mean(G)}};
 const T0=performance.now(),res={};
 for(const bn of Object.keys(BUILDS)){
  res[bn]={};
  for(const sc of SCALES){
   const base=play(BUILDS[bn],sc,{}),m0=Math.round(BUILDS[bn].tr.might*sc);
   for(const k of NODES){
    const n=Math.min(LV,sk.NODE[k].m),gold=goldFor(k,n);
    const nodeR=play(BUILDS[bn],sc,{[k]:n}),mightR=play(BUILDS[bn],sc,{might:Math.max(0,Math.round(mightExtra(m0,gold)))});
    const dn=nodeR.p/base.p-1,dm=mightR.p/base.p-1,gn=nodeR.g/base.g-1,gm=mightR.g/base.g-1;
    (res[bn][k]??=[]).push({dn,dm,gn,gm,gold});
   }
   await sleep(0);
  }
 }
 const f=v=>(v*100).toFixed(1).padStart(5)+'%';
 out.push('Each cell: node gain / same-gold Might gain, averaged over builds strengths '+SCALES.join('/')+' (level '+LV+'). progress | gold/min');
 for(const k of NODES){
  const row=Object.keys(BUILDS).map(bn=>{const a=res[bn][k];const dn=mean(a.map(x=>x.dn)),dm=mean(a.map(x=>x.dm)),gn=mean(a.map(x=>x.gn)),gm=mean(a.map(x=>x.gm));return bn.slice(0,5)+' '+f(dn)+'/'+f(dm)+' | '+f(gn)+'/'+f(gm)});
  out.push('## '+k.padEnd(12)+' cost '+goldFor(k,Math.min(LV,sk.NODE[k].m))+'g  '+row.join('  '));
 }
 out.push('seconds: '+((performance.now()-T0)/1000).toFixed(0));
}catch(e){out.push('EXC '+e.message+' | '+(e.stack||'').split('\n')[1])}
document.title=out.join(' ## ');
</script>

</body></html>
