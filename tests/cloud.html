<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>running</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head><body><div id="app">
<header><h1>Delve</h1><div id="top"></div></header>
<section id="battle" hidden>
 <div class="cv"><canvas id="c" width="192" height="108"></canvas><div id="fxl"></div>
  <div id="over" hidden><div class="px" style="font-size:12px">Defeated</div><div id="ovt"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button data-a="delveAgain" style="background:#d94a4a;color:#fff;border-color:#fff">⚔ Delve Again</button><button data-a="camp">Go to camp</button></div></div></div>
 <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>
 <div class="bar m" id="mpw"><i id="mpb"></i><span id="mpt"></span></div>
 <div class="bar e"><i id="ehb"></i><span id="ent"></span></div>
 <div class="row sp" style="margin:6px 0"><div class="row" id="spells"></div><div class="row"><button class="s alt" data-a="spd" id="spdb"></button><button class="s alt" data-a="end">End run</button></div></div>
 <div class="mute">Last drop</div><div id="last"></div><div class="mute" style="margin-top:6px">Loot this run</div><div id="feed"></div>
</section>
<section id="camp" hidden>
 <div class="row sp"><div class="tabs"><button data-a="tab" data-v="g" id="tg">Gear</button><button data-a="tab" data-v="u" id="tu">Upgrades</button><button data-a="tab" data-v="v" id="tv">Vault</button><button data-a="tab" data-v="m" id="tm">Magic</button><button data-a="tab" data-v="p" id="tp">Pets</button><button data-a="tab" data-v="r" id="tr2">Auras</button><button data-a="tab" data-v="i" id="ti">Idle</button><button data-a="tab" data-v="a" id="ta">Ascend</button><button data-a="tab" data-v="l" id="tl">Scores</button><button data-a="tab" data-v="x" id="tx">Account</button></div></div>
 <div style="margin:8px 0"><button data-a="delve" style="width:100%;font-size:22px;padding:10px;background:var(--btn);border-width:4px;box-shadow:5px 5px 0 var(--ink)">⚔ DELVE</button></div>
 <div id="sdw" class="row" style="margin:6px 0"></div><div id="cbody"></div><div style="margin:16px 0"><button class="s alt" data-a="reset">Reset save</button></div>
</section>
</div>
<script type="module">
const out=[],ck=(n,c,x)=>out.push(n+':'+(c?'ok':'FAIL'+(x!==undefined?'('+x+')':'')));
window.onerror=(m,u,l)=>out.push('ERR '+m+' @'+String(u).split('/').pop()+':'+l);
window.addEventListener('unhandledrejection',e=>out.push('REJ '+(e.reason&&e.reason.message||e.reason)));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
try{
 await import('/src/main.js');
 const st=await import('/src/state.js'),cloud=await import('/src/cloud.js'),gifts=await import('/src/gifts.js'),itemsMod=await import('/src/items.js'),T=cloud._test;
 const KEY='hollow-delve-2',cs=cloud.cloudState,dec=cloud.decodeSave;
 // ---- UI: account tab renders; a real (fake-credential) sign-in proves the Firebase SDK loads and the API key works
 st.setTab('x');(await import('/src/camp.js')).camp();
 ck('account-tab',!!document.querySelector('#ac-form')&&document.querySelector('#tx').className==='on');
 document.querySelector('#ac-email').value='nobody@example.invalid';document.querySelector('#ac-pass').value='not-a-real-password';
 document.querySelector('#ac-form').dispatchEvent(new Event('submit',{cancelable:true,bubbles:true}));
 for(let i=0;i<60&&!(cs().err||cs().msg);i++)await sleep(250);
 out.push('(real sign-in with fake creds -> "'+cs().err+'")');
 await sleep(2000); // let the real auth listener's first callback fire before we swap in the fake
 ck('sdk-loads-and-answers',cs().err.length>0&&!/unknown/.test(cs().err),cs().err);
 // ---- fake Firestore (in memory)
 const docs=new Map();
 const F={doc:(db,c,id)=>({path:c+'/'+id}),serverTimestamp:()=>({ts:1}),
  async getDoc(ref){const d=docs.get(ref.path);return{exists:()=>!!d,data:()=>d}},
  async runTransaction(db,fn){const pend=[];const tx={get:async ref=>({exists:()=>docs.has(ref.path),data:()=>docs.get(ref.path)}),set:(ref,d)=>pend.push([ref.path,d])};await fn(tx);for(const[p,d]of pend)docs.set(p,d)}};
 T.inject({A:{},F,auth:{},db:{}});
 const user=v=>({uid:'u1',email:'a@b.c',emailVerified:v});
 const played=(gold,best)=>({...st.def(),gold,best,bestOverall:best,lastT:Date.now()});
 const setLocal=o=>{localStorage.setItem(KEY,JSON.stringify(o));st.load()};
 const fresh=()=>{localStorage.removeItem('hd-cloud-base');localStorage.removeItem('hollow-delve-2-backup');localStorage.removeItem('hd-gifts-at');T.reset();setLocal(st.def())};
 const dget=async()=>JSON.parse(await dec(docs.get('saves/u1')));
 // 1 unverified user: nothing is written
 fresh();docs.clear();setLocal(played(500,12));await T.onUser(user(false));
 ck('unverified-writes-nothing',docs.size===0&&cs().user.verified===false);
 // 2 first verified sign-in, no cloud save: local is uploaded (compressed)
 await T.onUser(user(true));await sleep(100);
 const d1=docs.get('saves/u1');
 ck('first-signin-uploads',!!d1&&d1.v===1&&!!d1.summary&&(await dget()).gold===500,cs().err);
 ck('save-is-compressed',d1.enc==='gz1'&&d1.data.length<JSON.stringify(played(500,12)).length,d1&&d1.enc+' '+d1.data.length);
 // 3 new device (fresh local), cloud exists: cloud is applied silently
 fresh();await T.onUser(user(true));await sleep(100);
 ck('new-device-takes-cloud',st.S.gold===500&&!cs().conflict,'gold='+st.S.gold);
 // 4 both sides changed, no history: conflict, then resolve with cloud (local is backed up)
 fresh();setLocal(played(900,20));await T.onUser(user(true));await sleep(100);
 ck('conflict-detected',!!cs().conflict&&cs().conflict.local.gold===900&&cs().conflict.cloud.gold===500);
 await cloud.resolveConflict('cloud');
 ck('resolve-cloud',st.S.gold===500&&!cs().conflict&&JSON.parse(localStorage.getItem('hollow-delve-2-backup')).gold===900);
 // 5 conflict again, resolve with local: cloud is overwritten
 fresh();setLocal(played(900,20));await T.onUser(user(true));await sleep(100);await cloud.resolveConflict('local');
 ck('resolve-local',(await dget()).gold===900&&!cs().conflict);
 // 6 later play: cloud unchanged since our sync, so a normal push goes through
 setLocal({...JSON.parse(localStorage.getItem(KEY)),gold:1000,lastT:Date.now()+5});
 ck('normal-push',(await T.push(false))==='pushed'&&(await dget()).gold===1000);
 // 7 nothing but the timestamp changed: no write at all
 const t1=docs.get('saves/u1').clientT;
 setLocal({...JSON.parse(localStorage.getItem(KEY)),lastT:Date.now()+50});
 ck('timestamp-only-change-skips-write',(await T.push(false))==='skipped'&&docs.get('saves/u1').clientT===t1);
 // 8 another device writes to the cloud; our next push must NOT overwrite it
 const other=await T.encodeSave(JSON.stringify({...st.def(),gold:7777,best:99,bestOverall:99}));
 docs.set('saves/u1',{...docs.get('saves/u1'),clientT:t1+1,enc:other.enc,data:other.data});
 setLocal({...JSON.parse(localStorage.getItem(KEY)),gold:1100,lastT:Date.now()+90});
 let code='';try{await T.push(false)}catch(e){code=e.code}
 ck('push-refuses-to-clobber',code==='hd/conflict'&&(await dget()).gold===7777,code);
 T.reset();
 ck('signed-out-no-schedule',(T.schedule(),cs().dirty===false));
 // 9 an old, uncompressed cloud save (no `enc` field) still loads
 fresh();docs.set('saves/u1',{v:1,data:JSON.stringify(played(321,5)),clientT:Date.now(),summary:{},updatedAt:{}});
 await T.onUser(user(true));await sleep(100);
 ck('legacy-uncompressed-save-loads',st.S.gold===321,'gold='+st.S.gold);
 // 10 an enormous bag: the CLOUD copy is trimmed (lowest value first, order kept); local stays whole
 fresh();
 const big=[];for(let i=0;i<12000;i++)big.push(itemsMod.gen(1+Math.floor(Math.random()*150),Math.min(8,Math.floor(Math.random()*Math.random()*9.6))));
 const bigJson=JSON.stringify({...st.def(),gold:1,best:1,bestOverall:1,bag:big});
 T.setMax(100000);const fitted=await T.fit(bigJson);T.setMax(900000);const back=JSON.parse(await dec(fitted.payload));
 ck('huge-bag-trimmed-to-fit',fitted.trimmed>0&&fitted.payload.data.length<=100000&&back.bag.length===12000-fitted.trimmed,'trimmed='+fitted.trimmed+' enc='+(fitted.payload.data.length/1024|0)+'KB');
 const kept=new Set(back.bag.map(i=>i.id)),dropped=big.filter(i=>!kept.has(i.id));
 const minKept=Math.min(...back.bag.map(i=>itemsMod.val(i))),maxDropped=Math.max(...dropped.map(i=>itemsMod.val(i)));
 ck('trim-drops-lowest-value-first',maxDropped<=minKept,'maxDropped='+maxDropped+' minKept='+minKept);
 ck('trim-keeps-order',back.bag.every((it,i)=>i===0||it.id>back.bag[i-1].id));
 // 11 gifts: valid ones are claimed once; hostile or malformed ones are rejected or clamped
 fresh();setLocal(played(1000,10));const gold0=1000,bag0=st.S.bag.length;
 docs.clear();
 docs.set('gifts/global',{gifts:[
  {id:'g1',note:'Hello there',gold:100,gems:2,items:[{ty:'head',ri:2,il:50,lv:1,nm:'Test Crown of Testing',st:{def:10,hp:100}}],gen:[{ri:3,il:60,n:3,ty:'weapon'}]},
  {id:'g1',gold:5000},
  {id:'bad-type',items:[{ty:'nonsense',ri:2,il:50,nm:'Thing',st:{def:1}}]},
  {id:'xss',items:[{ty:'head',ri:1,il:5,nm:'<img src=x onerror=alert(1)>',st:{def:1}}]},
  {id:'old',until:1,gold:999},
  {id:'huge',gold:1e30,gems:1e30},
  {id:'bad id with spaces!',gold:5},
  {id:'bad-stat',items:[{ty:'head',ri:1,il:5,nm:'Plain Cap',st:{notastat:5,def:-3}}]},
 ]});
 docs.set('gifts/u1',{gifts:[{id:'mine',gold:7,note:'Just for you'}]});
 await T.onUser(user(true));await sleep(600);   // sync -> afterSync -> claimGifts
 const claimed=st.S.giftsClaimed.slice().sort().join(',');
 ck('gifts-claimed-via-sync-hook',claimed==='g:g1,g:huge,u:mine',claimed);
 ck('gift-gold-gems-clamped',st.S.gold===gold0+100+1e12+7&&st.S.gems===2+1e6,'gold='+st.S.gold+' gems='+st.S.gems);
 ck('gift-items-added',st.S.bag.length===bag0+4&&st.S.bag.some(i=>i.nm==='Test Crown of Testing'&&typeof i.id==='number'&&i.st.def===10),'bag '+bag0+'->'+st.S.bag.length);
 ck('no-markup-in-item-names',!st.S.bag.some(i=>/[<>]/.test(i.nm)));
 const n2=await gifts.claimGifts(true);
 ck('claim-is-idempotent',n2===0&&st.S.bag.length===bag0+4);
 T.reset();T.onUser(user(false));st.S.giftsClaimed=[];
 ck('unverified-cannot-claim',(await gifts.claimGifts(true))===0&&st.S.bag.length===bag0+4);
 // 12 normal save marks the cloud copy dirty
 fresh();docs.clear();setLocal(played(5,1));await T.onUser(user(true));await sleep(100);st.save();
 ck('save-hook-marks-dirty',cs().dirty===true);
 T.reset();
}catch(e){out.push('EXC '+e.message+' | '+(e.stack||'').split('\n')[1])}
document.title=out.join(' ');
</script>

</body></html>
