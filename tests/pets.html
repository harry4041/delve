<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>running</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head><body><div id="app">
<header><h1>Delve</h1><div id="top"></div></header>
<section id="battle" hidden>
 <div class="cv"><canvas id="c" width="192" height="108"></canvas><div id="fxl"></div>
  <div id="over" hidden><div class="px" style="font-size:12px">Defeated</div><div id="ovt"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button data-a="delveAgain" style="background:#d94a4a;color:#fff;border-color:#fff">⚔ Delve Again</button><button data-a="camp">Go to camp</button></div></div></div>
 <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>
 <div class="bar m" id="mpw"><i id="mpb"></i><span id="mpt"></span></div>
 <div class="bar e"><i id="ehb"></i><span id="ent"></span></div>
 <div class="row sp" style="margin:6px 0"><div class="row" id="spells"></div><div class="row"><button class="s alt" data-a="spd" id="spdb"></button><button class="s alt" data-a="end">End run</button></div></div>
 <div class="mute">Last drop</div><div id="last"></div><div class="mute" style="margin-top:6px">Loot this run</div><div id="feed"></div>
</section>
<section id="camp" hidden>
 <div class="row sp"><div class="tabs"><button data-a="tab" data-v="g" id="tg">Gear</button><button data-a="tab" data-v="u" id="tu">Upgrades</button><button data-a="tab" data-v="v" id="tv">Vault</button><button data-a="tab" data-v="m" id="tm">Magic</button><button data-a="tab" data-v="p" id="tp">Pets</button><button data-a="tab" data-v="r" id="tr2">Auras</button><button data-a="tab" data-v="i" id="ti">Idle</button><button data-a="tab" data-v="a" id="ta">Ascend</button><button data-a="tab" data-v="l" id="tl">Scores</button><button data-a="tab" data-v="x" id="tx">Account</button></div></div>
 <div style="margin:8px 0"><button data-a="delve" style="width:100%;font-size:22px;padding:10px;background:var(--btn);border-width:4px;box-shadow:5px 5px 0 var(--ink)">⚔ DELVE</button></div>
 <div id="sdw" class="row" style="margin:6px 0"></div><div id="cbody"></div><div style="margin:16px 0"><button class="s alt" data-a="reset">Reset save</button></div>
</section>
</div>
<script type="module">
const out=[],ck=(n,c,x)=>out.push(n+':'+(c?'ok':'FAIL'+(x!==undefined?'('+x+')':'')));
window.onerror=(m,u,l)=>out.push('ERR '+m+' @'+String(u).split('/').pop()+':'+l);
try{
 await import('/src/main.js');
 const st=await import('/src/state.js'),bt=await import('/src/battle.js'),pets=await import('/src/pets.js'),rd=await import('/src/render.js'),sk=await import('/src/skilltree.js'),tv=await import('/src/treeview.js');
 const KEY='hollow-delve-2';
 const reset=()=>{localStorage.removeItem(KEY);st.load();st.S.gold=1e9;st.S.best=30};
 const own=(i,lvl=0)=>{st.S.pets[i]={own:1,lvl,star:0};st.S.ap=i};
 // 1 an old 3-pet save is padded to the new roster without losing anything
 localStorage.setItem(KEY,JSON.stringify({...st.def(),ap:2,pets:[{own:1,lvl:4,star:1},{own:0,lvl:0},{own:1,lvl:2}]}));st.load();
 ck('old-save-padded',st.S.pets.length===st.PET.length&&st.PET.length===6&&st.S.pets[0].lvl===4&&st.S.pets[0].star===1&&st.S.pets[2].own===1&&!st.S.pets[5].own,JSON.stringify(st.S.pets.map(p=>p.own)));
 // 2 abilities: unowned pets do nothing; owned pets each produce their signature numbers
 reset();
 const none=pets.petFx(0);ck('unowned-pet-no-effect',Object.values(none).every(v=>!v||v===1));
 const keys={pip:['slow','heal'],fang:['boss'],ember:['burnCap','burnTick'],moss:['redirect','reflect'],coin:['gold','loot'],spark:['mana','cdr','haste']};
 let allOk=true;st.PET.forEach((P,i)=>{own(i,3);const f=pets.petFx(i);for(const k of keys[P.k])if(!(f[k]>(k==='boss'?1:0)))allOk=false;if(!pets.petInfo(i))allOk=false});
 ck('each-pet-has-its-ability',allOk);
 // 3 the pets tab and the tree show everything
 st.S.tr.den=1;st.setTab('p');
 const html=rd.petTab();
 ck('pets-tab-lists-all-six',st.PET.every(P=>html.includes(P.n)&&html.includes(P.ab)),html.length);
 const th=tv.tree(sk.GRAPHS.p);
 ck('tree-has-signature-arm',['Sticky','Alpha','Inferno','Granite','Pickpocket','Surge','Signatures'].every(w=>th.includes(w)));
 ck('graph-nodes-all-defined',sk.GRAPHS.p.arms.every(a=>a.ks.every(k=>sk.NODE&&sk.NODE[k])));
 // 4 combat effects
 const fresh=(i,lvl=3)=>{reset();st.S.tr.den=1;own(i,lvl);bt.startRun();return st.run};
 // Ember: burn stacks appear after pet hits
 let r=fresh(2);for(let n=0;n<120&&!(r.pb&&r.pb.n>=1);n++)bt.tick(.1);
 ck('ember-applies-burn',!!(r.pb&&r.pb.n>=1),'pb='+JSON.stringify(r.pb));
 // Pip: heals on pet hits (no enemy damage)
 r=fresh(0);r.eAtk=0;r.stun=1e6;r.hT=-1e9;const hpStart=Math.floor(r.maxHp/2);r.hp=hpStart;for(let n=0;n<40;n++)bt.tick(.1);
 ck('pip-heals',r.hp>hpStart,'hp='+r.hp+' start='+hpStart);
 // Moss: takes a share of damage and reflects it (hero and pet attacks paused)
 r=fresh(3);r.hT=-1e9;r.pT=-1e9;r.eHp=r.eMax=1e12;r.eAtk=500;r.hp=1e9;const hp0=r.hp;for(let n=0;n<30;n++)bt.tick(.1);
 const lost=hp0-r.hp;ck('moss-reflects-damage',r.totalDmg>0&&lost>0,'reflected='+r.totalDmg+' lost='+lost);
 const noPetLost=(()=>{r=fresh(3);st.S.ap=-1;r.hT=-1e9;r.pT=-1e9;r.eHp=r.eMax=1e12;r.eAtk=500;r.hp=1e9;const h=r.hp;for(let n=0;n<30;n++)bt.tick(.1);return h-r.hp})();
 ck('moss-reduces-damage-taken',lost<noPetLost,'with='+lost+' without='+noPetLost);
 // Pip slows enemies: fewer enemy attacks in the same time
 const hits=(i)=>{r=fresh(i,i===0?10:3);if(i<0)st.S.ap=-1;r.hT=-1e9;r.pT=-1e9;r.eHp=r.eMax=1e12;r.eAtk=1;let n0=0,last=r.hp;for(let n=0;n<300;n++){bt.tick(.1);if(r.hp<last)n0++;last=r.hp}return n0};
 const hNone=(()=>{r=fresh(0);st.S.ap=-1;r.hT=-1e9;r.pT=-1e9;r.eHp=r.eMax=1e12;r.eAtk=40;r.hp=1e9;let c=0,l=r.hp;for(let n=0;n<300;n++){bt.tick(.1);if(r.hp<l)c++;l=r.hp}return c})();
 const hPip=(()=>{r=fresh(0,10);r.eAtk=40;r.hT=-1e9;r.pT=-1e9;r.eHp=r.eMax=1e12;r.hp=1e9;let c=0,l=r.hp;for(let n=0;n<300;n++){bt.tick(.1);if(r.hp<l)c++;l=r.hp}return c})();
 ck('pip-slows-enemy-attacks',hPip<hNone,'with='+hPip+' without='+hNone);
 // Coin: more gold from the same kill
 const killGold=(i)=>{r=fresh(i<0?0:i);st.S.tr.greed=20;if(i<0)st.S.ap=-1;r.hT=1e9;r.eHp=1;bt.tick(.1);return r.gold};
 const gNone=killGold(-1),gCoin=killGold(4);ck('coin-extra-gold',gCoin>gNone,'coin='+gCoin+' none='+gNone);
 // Spark: faster mana
 const mana=(i)=>{r=fresh(i<0?0:i);if(i<0)st.S.ap=-1;r.mp=0;r.hT=-1e9;r.pT=-1e9;r.eHp=r.eMax=1e12;r.eAtk=0;for(let n=0;n<50;n++)bt.tick(.1);return r.mp};
 const mN=mana(-1),mS=mana(5);ck('spark-more-mana',mS>mN,'spark='+mS.toFixed(1)+' none='+mN.toFixed(1));
 // Fang: bosses take more per pet hit than normal enemies
 const dmgAvg=(boss)=>{reset();st.S.tr.den=1;st.S.tr.might=40;own(1,3);bt.startRun();r=st.run;let tot=0,cnt=0;for(let n=0;n<60;n++){r.boss=boss;r.hT=-1e9;r.eHp=r.eMax=1e12;r.eAtk=0;r.pT=1e9;r.totalDmg=0;bt.tick(.01);tot+=r.totalDmg;cnt++}return tot/cnt};
 const dn=dmgAvg(false),db=dmgAvg(true);ck('fang-boss-bonus',db>dn*1.1,'boss='+db.toFixed(1)+' normal='+dn.toFixed(1));
 // 5 a full short run with every pet completes without errors
 let err='';for(let i=0;i<6;i++){try{r=fresh(i,5);for(let n=0;n<400&&!r.over;n++)bt.tick(.1)}catch(e){err+=st.PET[i].k+':'+e.message+' '}}
 ck('every-pet-survives-a-run',err==='',err);
}catch(e){out.push('EXC '+e.message+' | '+(e.stack||'').split('\n')[1])}
document.title=out.join(' ');
</script>

</body></html>
