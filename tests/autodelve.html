<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>running</title>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&family=VT323&display=swap" rel="stylesheet">
</head><body><div id="app">
<header><h1>Delve</h1><div id="top"></div></header>
<section id="battle" hidden>
 <div class="cv"><canvas id="c" width="192" height="108"></canvas><div id="fxl"></div>
  <div id="over" hidden><div class="px" style="font-size:12px">Defeated</div><div id="ovt"></div><div style="display:flex;gap:8px;flex-wrap:wrap;justify-content:center"><button data-a="delveAgain" style="background:#d94a4a;color:#fff;border-color:#fff">⚔ Delve Again</button><button data-a="camp">Go to camp</button><button class="s alt" data-a="auto" id="autoo">Auto-delve: OFF</button></div></div></div>
 <div class="bar"><i id="hpb"></i><span id="hpt"></span></div>
 <div class="bar m" id="mpw"><i id="mpb"></i><span id="mpt"></span></div>
 <div class="bar e"><i id="ehb"></i><span id="ent"></span></div>
 <div class="row sp" style="margin:6px 0"><div class="row" id="spells"></div><div class="row"><button class="s alt" data-a="auto" id="autob">Auto-delve: OFF</button><button class="s alt" data-a="spd" id="spdb"></button><button class="s alt" data-a="end">End run</button></div></div>
 <div class="mute">Last drop</div><div id="last"></div><div class="mute" style="margin-top:6px">Loot this run</div><div id="feed"></div>
</section>
<section id="camp" hidden>
 <div class="row sp"><div class="tabs"><button data-a="tab" data-v="g" id="tg">Gear</button><button data-a="tab" data-v="u" id="tu">Upgrades</button><button data-a="tab" data-v="v" id="tv">Vault</button><button data-a="tab" data-v="m" id="tm">Magic</button><button data-a="tab" data-v="p" id="tp">Pets</button><button data-a="tab" data-v="r" id="tr2">Auras</button><button data-a="tab" data-v="i" id="ti">Idle</button><button data-a="tab" data-v="a" id="ta">Ascend</button><button data-a="tab" data-v="l" id="tl">Scores</button><button data-a="tab" data-v="x" id="tx">Account</button></div></div>
 <div style="margin:8px 0"><button data-a="delve" style="width:100%;font-size:22px;padding:10px;background:var(--btn);border-width:4px;box-shadow:5px 5px 0 var(--ink)">⚔ DELVE</button></div>
 <div id="sdw" class="row" style="margin:6px 0"></div><div id="cbody"></div><div style="margin:16px 0"><button class="s alt" data-a="reset">Reset save</button></div>
</section>
</div>
<script type="module">
const out=[],ck=(n,c,x)=>out.push(n+':'+(c?'ok':'FAIL'+(x!==undefined?'('+x+')':'')));
window.onerror=(m,u,l)=>out.push('ERR '+m+' @'+String(u).split('/').pop()+':'+l);
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
try{
 await import('/src/main.js');
 const st=await import('/src/state.js'),bt=await import('/src/battle.js'),cp=await import('/src/camp.js');
 const KEY='hollow-delve-2',S=()=>st.S;
 const click=sel=>{const e=document.querySelector(sel);e.click()};
 const die=()=>{st.run.hp=0;for(let i=0;i<5&&!st.run.over;i++)bt.tick(.1)};
 localStorage.removeItem(KEY);st.load();
 ck('default-off',S().autoDelve===false);
 bt.startRun();ck('battle-has-toggle-buttons',!!document.querySelector('#autob')&&!!document.querySelector('#autoo'));
 await sleep(200);ck('label-says-off',document.querySelector('#autob').textContent.includes('OFF'));
 // off: defeat screen stays
 die();const r0=st.run;await sleep(2600);ck('off-stays-on-defeat-screen',st.run===r0&&st.run.over&&st.mode==='battle');
 // toggle on from the defeat screen
 click('#autoo');ck('toggle-flips-the-setting',S().autoDelve===true);
 await sleep(2600);ck('on-starts-a-new-run-after-the-delay',st.run!==r0&&!st.run.over&&st.mode==='battle',String(st.run===r0));
 ck('label-says-on',document.querySelector('#autob').textContent.includes('ON'));
 ck('overlay-hidden-again',document.querySelector('#over').hidden===true);
 // loot is banked
 const bagBefore=S().bag.length;st.run.loot=[{id:9991,ty:'weapon',ri:0,il:1,nm:'Test Sword',st:{atk:1}},{id:9992,ty:'head',ri:0,il:1,nm:'Test Cap',st:{def:1}}];const r1=st.run;die();await sleep(2600);
 ck('loot-banked-into-bag',st.run!==r1&&S().bag.length>=bagBefore+2&&S().bag.some(x=>x.id===9991),S().bag.length+' vs '+bagBefore);
 // bag cap respected
 const cap=await import('/src/skilltree.js');const bc=cap.bagCap();
 S().bag=[];for(let i=0;i<bc+25;i++)S().bag.push({id:5000+i,ty:'weapon',ri:0,il:1,nm:'Junk '+i,st:{atk:1}});
 const r2=st.run;die();await sleep(2600);ck('bag-trimmed-to-cap',st.run!==r2&&S().bag.length<=bc,S().bag.length+'/'+bc);
 // never restarts while the player is in camp
 click('[data-a=camp]');const r3=st.run;await sleep(2600);ck('no-auto-delve-at-camp',st.mode==='camp'&&st.run===r3);
 // manual delve still works, setting persists through save/load
 st.save();const saved=JSON.parse(localStorage.getItem(KEY));ck('setting-saved',saved.autoDelve===true);
 st.load();ck('setting-survives-load',S().autoDelve===true);
 localStorage.setItem(KEY,JSON.stringify({...saved,autoDelve:'yes please'}));st.load();ck('odd-value-coerced-to-boolean',S().autoDelve===true);
 localStorage.removeItem(KEY);st.load();ck('old-save-without-field-defaults-off',S().autoDelve===false);
 // off again stops it
 S().autoDelve=false;click('[data-a=delve]');await sleep(100);click('#autob');ck('toggle-button-in-battle-row-turns-it-on',S().autoDelve===true);click('#autob');ck('and-off-again',S().autoDelve===false);
 S().autoDelve=false;const r4=st.run;die();await sleep(2600);ck('off-again-stays-defeated',st.run===r4&&st.run.over);
}catch(e){out.push('EXC '+e.message+' | '+(e.stack||'').split(String.fromCharCode(10))[1])}
document.title=out.join(' ');
</script></body></html>
